<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="main-wrapper">
        <!-- Left Section (Hero & Mockups) -->
        <div class="left-section">
            <div class="content-wrapper">
                <div class="logo">
                    <svg aria-label="Instagram" role="img" viewBox="0 0 24 24" fill="url(#instagram-gradient)" height="45" width="45">
                        <defs>
                            <radialGradient id="instagram-gradient" cx="20%" cy="100%" r="120%">
                                <stop offset="0%" stop-color="#fdf497"></stop>
                                <stop offset="5%" stop-color="#fdf497"></stop>
                                <stop offset="45%" stop-color="#fd5949"></stop>
                                <stop offset="60%" stop-color="#d6249f"></stop>
                                <stop offset="90%" stop-color="#285AEB"></stop>
                            </radialGradient>
                        </defs>
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>
                </div>
                
                <h1>See everyday moments from your <span class="rainbow-text">close friends.</span></h1>

                <div class="mockup-container">
                    <!-- Left Phone Card -->
                    <div class="phone-card card-left">
                        <div class="insta-gradient-heart">
                            <svg aria-label="Like" role="img" viewBox="0 0 24 24" fill="url(#heart-gradient)" height="32" width="32">
                                <defs>
                                    <linearGradient id="heart-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
                                        <stop offset="0%" stop-color="#ff8a00"/>
                                        <stop offset="50%" stop-color="#e52e71"/>
                                        <stop offset="100%" stop-color="#b83280"/>
                                    </linearGradient>
                                </defs>
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                        </div>
                    </div>
                    
                    <!-- Center Phone Card with Thicker Story Bars -->
                    <div class="phone-card card-center">
                        <div class="story-bars-container">
                            <div class="story-bar active"></div>
                            <div class="story-bar"></div>
                            <div class="story-bar"></div>
                        </div>
                        <div class="card-footer-icons">
                            <i class="fa-regular fa-heart"></i>
                        </div>
                    </div>
                    
                    <!-- Right Phone Card with Rainbow Story Ring -->
                    <div class="phone-card card-right">
                        <div class="green-star-badge"><i class="fa-solid fa-star"></i></div>
                        <div class="story-ring-avatar-container">
                            <div class="story-ring-avatar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Section (Login Box & Fixed Meta Logo) -->
        <div class="right-section">
            <div class="login-inner-container">
                <div class="login-card">
                    <h2>Log into Instagram</h2>
                    <form>
                        <div class="input-group">
                            <input type="text" required placeholder=" ">
                            <label>Mobile number, username or email</label>
                        </div>
                        <div class="input-group">
                            <input type="password" required placeholder=" ">
                            <label>Password</label>
                        </div>
                        <button type="submit" class="login-btn">Log in</button>
                    </form>

                    <div class="forgot-password">
                        <a href="#">Forgot password?</a>
                    </div>

                    <div class="divider-container">
                        <div class="line"></div>
                        <span class="or-text">OR</span>
                        <div class="line"></div>
                    </div>

                    <button class="fb-login-btn">
                        <i class="fa-brands fa-facebook"></i> Log in with Facebook
                    </button>
                </div>

                <div class="create-account-card">
                    <span>Don't have an account?</span> <button class="create-btn">Create new account</button>
                </div>

                <!-- Fully Fixed Meta Logo without any overlapping or cutoff -->
                <div class="meta-logo-container">
                    <div class="meta-brand">
                        <svg class="meta-infinity" viewBox="0 0 28 12" width="32" height="14">
                            <path fill="#0064e0" d="M12.5,5.2 C11.9,4.4 11.1,3.9 10.1,3.9 C8.3,3.9 6.8,5.4 6.8,7.2 C6.8,9 8.3,10.5 10.1,10.5 C11.5,10.5 12.7,9.5 13.2,8.2 L15.6,8.2 C15,10.8 12.8,12.5 10.1,12.5 C6.9,12.5 4.3,9.9 4.3,6.8 C4.3,3.7 6.9,1.1 10.1,1.1 C12.1,1.1 13.9,2.2 14.8,3.9 L12.5,5.2 Z"></path>
                            <path fill="#0064e0" d="M21.5,1.1 C18.3,1.1 15.7,3.7 15.7,6.8 C15.7,9.9 18.3,12.5 21.5,12.5 C24.7,12.5 27.3,9.9 27.3,6.8 C27.3,3.7 24.7,1.1 21.5,1.1 Z M21.5,10.3 C19.5,10.3 17.9,8.7 17.9,6.8 C17.9,4.9 19.5,3.3 21.5,3.3 C23.5,3.3 25.1,4.9 25.1,6.8 C25.1,8.7 23.5,10.3 21.5,10.3 Z"></path>
                        </svg>
                        <span class="meta-word">Meta</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Links -->
    <footer>
        <div class="footer-links">
            <a href="#">Meta</a>
            <a href="#">About</a>
            <a href="#">Blog</a>
            <a href="#">Jobs</a>
            <a href="#">Help</a>
            <a href="#">API</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Locations</a>
            <a href="#">Popular</a>
            <a href="#">Instagram Lite</a>
            <a href="#">Meta AI</a>
            <a href="#">Threads</a>
            <a href="#">Contact Uploading & Non-Users</a>
            <a href="#">Meta Verified</a>
        </div>
        <div class="footer-bottom">
            <span>English (UK)</span>
            <span>© 2026 Instagram from Meta</span>
        </div>
    </footer>

</body>
</html>
